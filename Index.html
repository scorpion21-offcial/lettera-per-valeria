<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 Buon 21° Compleanno Valeria 💌</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at top, #ffe9f0, #ffd8e4, #ffc1d6);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
  }

  /* Busta */
  .envelope {
    position: relative;
    width: 350px;
    height: 230px;
    background: linear-gradient(145deg, #fff, #f9f3f3);
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    cursor: pointer;
    transform-style: preserve-3d;
    perspective: 1000px;
    z-index: 1;
  }

  .flap {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 120px;
    background: linear-gradient(145deg, #ffcad4, #f7a8b8);
    clip-path: polygon(0 0, 50% 100%, 100% 0);
    transform-origin: top;
    transition: transform 1s cubic-bezier(0.6, 0.04, 0.98, 0.335);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .heart {
    font-size: 45px;
    color: #e63946;
    text-shadow: 0 0 15px #ff7da1;
    animation: pulse 1.3s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }

  .letter {
    position: absolute;
    top: 60%;
    left: 50%;
    width: 290px;
    height: 200px;
    background: linear-gradient(135deg, #fff8f0, #ffe7c7);
    border-radius: 12px;
    text-align: center;
    padding: 25px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.3);
    transform: translate(-50%, -50%) translateY(120px);
    opacity: 0;
    transition: all 1.3s ease;
    z-index: 2;
  }

  .letter h2 {
    color: #d63384;
    margin-bottom: 12px;
    font-size: 23px;
    text-shadow: 0 0 5px #fff;
  }

  .letter p {
    color: #4a4a4a;
    font-size: 15px;
    margin-bottom: 25px;
    line-height: 1.5;
  }

  .envelope.open .flap {
    transform: rotateX(180deg);
  }

  .envelope.open .letter {
    transform: translate(-50%, -50%) translateY(-25px);
    opacity: 1;
  }

  /* Coriandoli */
  .confetti {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }

  .confetti span {
    position: absolute;
    width: 10px;
    height: 10px;
    background: hsl(var(--hue), 80%, 70%);
    top: -10px;
    border-radius: 50%;
    animation: fall 3s linear infinite;
  }

  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(600px) rotate(720deg); opacity: 0; }
  }

  /* Firma animata */
  svg {
    width: 230px;
    height: 60px;
    overflow: visible;
  }

  path {
    fill: none;
    stroke: #d4af37;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 900;
    stroke-dashoffset: 900;
    animation: draw 4s ease forwards;
    animation-delay: 3.3s;
  }

  @keyframes draw {
    to { stroke-dashoffset: 0; }
  }

  .pen {
    position: absolute;
    width: 22px;
    height: 22px;
    background: linear-gradient(145deg, #d4af37, #b8860b);
    border-radius: 50%;
    top: 80%;
    left: 50%;
    opacity: 0;
    transform: translate(-50%, -50%);
    animation: movePen 4s linear forwards;
    animation-delay: 3.3s;
  }

  @keyframes movePen {
    0% { opacity: 1; transform: translate(15px, 20px); }
    100% { opacity: 0; transform: translate(210px, 10px); }
  }

  .name {
    font-family: 'Brush Script MT', cursive;
    font-size: 28px;
    color: #d4af37;
    margin-top: -5px;
  }

  /* Ruota impostazioni */
  .settings {
    position: fixed;
    top: 10px;
    right: 10px;
    width: 25px;
    height: 25px;
    background: #d4af37;
    border-radius: 50%;
    box-shadow: 0 0 5px rgba(0,0,0,0.3);
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 14px;
    z-index: 1000;
  }

  .settings-panel {
    position: fixed;
    top: 40px;
    right: 10px;
    width: 180px;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    display: none;
    z-index: 1000;
    font-size: 14px;
  }

  .settings-panel label {
    display: block;
    margin: 5px 0;
  }

  .settings-panel input[type="range"] {
    width: 100%;
  }
</style>
</head>
<body>

<!-- Busta e lettera -->
<div class="envelope" id="envelope">
  <div class="flap">
    <div class="heart">💖</div>
  </div>
  <div class="letter">
    <h2>🎂 Buon 21° Compleanno Valeria! 🌸</h2>
    <p>21 anni! ✨<br>
    Sei una ragazza straordinaria, piena di luce e di energia.<br>
    Ti auguro una vita scintillante, colma di amore, sogni realizzati<br>
    e momenti che ti lascino senza fiato 💕</p>

    <div style="margin-top:10px; position:relative; display:inline-block;">
      <svg viewBox="0 0 400 80">
        <path d="M10 40 Q30 10, 60 40 T110 40 Q130 70, 160 40 T210 40 Q230 10, 260 40 T310 40 Q330 70, 360 40" />
      </svg>
      <div class="pen"></div>
    </div>
    <div class="name">Damiano Fantasia</div>
  </div>
  <div class="confetti" id="confetti"></div>
</div>

<!-- Ruota impostazioni -->
<div class="settings" id="settingsBtn">⚙️</div>
<div class="settings-panel" id="settingsPanel">
  <label>
    <input type="checkbox" id="musicToggle" checked> Musica attiva
  </label>
  <label>
    Volume: <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">
  </label>
</div>

<script>
const envelope = document.getElementById('envelope');
const confettiContainer = document.getElementById('confetti');
let audio; // qui metti tu la tua musica

// Apertura busta
envelope.addEventListener('click', () => {
  envelope.classList.toggle('open');
  if (envelope.classList.contains('open')) {
    // Coriandoli
    for (let i = 0; i < 60; i++) {
      const conf = document.createElement('span');
      conf.style.setProperty('--hue', Math.random() * 60 + 300);
      conf.style.left = Math.random() * 100 + '%';
      conf.style.animationDelay = Math.random() * 2 + 's';
      confettiContainer.appendChild(conf);
    }

    // --- QUI PUOI METTERE IL LINK ALLA TUA CANZONE ---
    // esempio:
    // audio = new Audio('TUO_LINK_CANALE.mp3');
    // audio.volume = 0.5;
    // audio.play();

  } else {
    confettiContainer.innerHTML = '';
    if (audio) {
      audio.pause();
      audio.currentTime = 0;
    }
  }
});

// Ruota impostazioni
const settingsBtn = document.getElementById('settingsBtn');
const settingsPanel = document.getElementById('settingsPanel');
const musicToggle = document.getElementById('musicToggle');
const volumeSlider = document.getElementById('volumeSlider');

settingsBtn.addEventListener('click', () => {
  settingsPanel.style.display = settingsPanel.style.display === 'block' ? 'none' : 'block';
});

musicToggle.addEventListener('change', () => {
  if (audio) audio.muted = !musicToggle.checked;
});

volumeSlider.addEventListener('input', () => {
  if (audio) audio.volume = volumeSlider.value;
});
</script>

</body>
</html>
